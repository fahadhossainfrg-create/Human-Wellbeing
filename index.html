.module-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.module-card{border:1px solid var(--line);background:linear-gradient(160deg,var(--surface),color-mix(in srgb,var(--surface2) 62%,var(--surface)));color:var(--ink);border-radius:13px;padding:20px;text-align:left;transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;box-shadow:0 1px 0 rgba(255,255,255,.03)}.module-card:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--almond) 42%,var(--line))}.flat-icon{width:54px;height:54px;border-radius:9px;display:grid;place-items:center;font-family:"Manrope",sans-serif;font-size:.82rem;font-weight:800;letter-spacing:.08em;color:var(--almond2);background:#31463a;border:1px solid #465f4d}.module-card:nth-child(2n) .flat-icon{background:#3a4c40}.module-card:nth-child(3n) .flat-icon{background:#5a463e;border-color:#73584e}.module-card:nth-child(4n) .flat-icon{background:#41483e}.module-card h3{color:var(--navy);margin:13px 0 7px}.module-card p{color:var(--muted);font-size:.92rem;margin:0}.go{display:flex;justify-content:space-between;align-items:center;margin-top:16px;color:var(--blue);font-weight:900}.go span:last-child{width:30px;height:30px;border-radius:7px;background:var(--almond);color:#26332b;display:grid;place-items:center}

 10%,transparent)}}.node{position:absolute;transform:translate(-50%,-50%);width:108px;min-height:58px;border-radius:9px;border:1px solid var(--nodeBorder);background:var(--nodeBg);color:var(--nodeText);font-family:"IBM Plex Sans",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;transition:transform .2s ease,background .2s ease,border-color .2s ease,color .2s ease,box-shadow .2s ease;z-index:3;padding:7px}.node:hover{transform:translate(-50%,-50%) scale(1.045);border-color:var(--almond)}.node .node-code{font-family:"Manrope",sans-serif;font-size:.66rem;letter-spacing:.09em;font-weight:800}.node small{font-size:.72rem;line-height:1.05;color:inherit;opacity:.82}.node.active{background:var(--almond);color:#29352e;border-color:var(--almond);box-shadow:0 8px 28px color-mix(in srgb,var(--almond) 18%,transparent)}.node.related{border-color:var(--blue2);box-shadow:0 0 0 1px color-mix(in srgb,var(--blue2) 28%,transparent)}.connection-readout{position:relative;z-index:1;border-top:1px solid var(--line);padding-top:15px;display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start}.connection-readout b{font-family:"Manrope",sans-serif;color:var(--ink);font-size:1.05rem}.connection-readout span{color:var(--muted);font-size:.92rem}.related-chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.related-chip{border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 68%,transparent);color:var(--ink);border-radius:6px;padding:5px 8px;font-size:.72rem;font-weight:700}.interaction-copy{animation:interactionIn .24s ease both}@keyframes interactionIn{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:none}}

const DATA={"modules":[{"id":"wellbeing","icon":"01","title":"Understanding Human Wellbeing","description":"Explore what wellbeing means and how physical, emotional, social, economic, environmental, cultural and political factors connect.","topics":[1,2,3,4,5,6],"sources":[]},{"id":"disparities","icon":"02","title":"Regional Disparities","description":"See why access to services, opportunities and quality of life differs from place to place.","topics":[7,8,9,10,11,12],"sources":[]},{"id":"measurement","icon":"03","title":"Measuring Human Wellbeing","description":"Explore indicators, HDI and the strengths and limits of measuring wellbeing with data.","topics":[13,14,15,16,17,18,19],"sources":[{"url":"https://hdr.undp.org/data-center/human-development-index","name":"UNDP – Human Development Index","description":"Official HDI method and data."},{"url":"https://www.oecd.org/en/data/tools/well-being-data-monitor/current-well-being.html","name":"OECD Well-being Data Monitor","description":"Broader multidimensional wellbeing comparison."}]},{"id":"sustainable","icon":"04","title":"Sustainable Development","description":"Connect present-day development with future wellbeing through sustainability and the SDGs.","topics":[20,21,22,23,24],"sources":[{"url":"https://sdgs.un.org/goals","name":"United Nations – Sustainable Development Goals","description":"Official 17 goals and the 2030 Agenda."}]},{"id":"poverty","icon":"05","title":"Poverty, Disadvantage & NGOs","description":"Understand poverty, disadvantage, connected barriers and the role of organisations that respond to them.","topics":[25,26,27,28,29,30],"sources":[{"url":"https://www.worldbank.org/en/news/factsheet/2025/06/05/june-2025-update-to-global-poverty-lines","name":"World Bank – Global poverty line update","description":"Current international extreme-poverty line and explanation of PPP."}]},{"id":"population","icon":"06","title":"Population Pyramids & Wellbeing","description":"Read population structures and connect demographic change with services, planning and quality of life.","topics":[31,32,33,34,35,36],"sources":[{"url":"https://www.abs.gov.au/statistics/people/population/population-clock-pyramid","name":"Australian Bureau of Statistics – Population clock and pyramid","description":"Interactive Australian population pyramid and projections."}]}],"topics":[{"id":1,"module":"wellbeing","title":"What human wellbeing means","paragraphs":["Human wellbeing means the overall quality of a person’s life. It is not just about being happy, and it is not just about having money. A person can have a high income but still experience poor health, loneliness, stress or a lack of freedom. In the same way, a person with a modest income may still have strong relationships, a sense of purpose, cultural connection and a safe community.","When geographers study human wellbeing, they look at the conditions that help people live healthy, secure, meaningful and fulfilling lives. These conditions include access to food, clean water, healthcare, housing, education, employment, supportive relationships, a safe environment, cultural identity and political rights. Wellbeing is therefore multidimensional. This means that it has many connected parts.","It is also important to remember that wellbeing can be understood differently by different people and communities. Culture, values, age, location and life experiences can influence what a “good life” means. The key idea is that human wellbeing is about how well people are able to live, meet their needs, participate in society and pursue opportunities that matter to them."],"terms":[{"term":"human wellbeing","meaning":"the overall quality of life of a person or community"},{"term":"quality of life","meaning":"how healthy, safe, secure, connected and satisfied a person is"},{"term":"multidimensional","meaning":"made up of several connected parts"}],"challenge":"Write five things people need for a good quality of life. Label each as physical, economic, social, environmental, cultural, emotional or political.","question":"Why is human wellbeing broader than happiness or income?","answer":"Because wellbeing includes many connected dimensions such as health, relationships, environment, culture, rights and economic security."},{"id":2,"module":"wellbeing","title":"Needs, wants, happiness and place","paragraphs":["A useful way to begin thinking about wellbeing is to separate needs from wants. A need is something that is necessary for a safe, healthy or dignified life, such as food, clean water, shelter, healthcare and personal safety. A want is something a person would like to have, but can live without. The difference is not always simple, because some things may be essential in one society and less important in another. Reliable internet, for example, may not be a survival need, but it can be very important for education, employment and social connection.","Happiness is connected to wellbeing, but the two ideas are not identical. Happiness is mainly about how people feel, while wellbeing includes both feelings and measurable living conditions. Someone may feel happy for a short time even while facing serious financial or health problems. Another person may have safe housing, education and healthcare but still feel isolated or stressed.","Place matters too. Where people live can influence access to jobs, schools, hospitals, transport, green space, clean air and community support. This is why geography is important when we study wellbeing. Wellbeing is shaped by both personal experiences and the opportunities available in particular places."],"terms":[{"term":"need","meaning":"something necessary for health, safety or dignity"},{"term":"want","meaning":"something desirable but not essential"},{"term":"place","meaning":"the location and environment where people live"},{"term":"happiness","meaning":"a feeling of satisfaction or positive emotion"}],"challenge":"Classify clean water, a smartphone, safe housing, a car, healthcare, streaming subscriptions, friendship and reliable internet as needs or wants. Discuss any examples that could depend on context.","question":"How can place affect wellbeing?","answer":"Place can affect access to services, jobs, transport, healthcare, clean environments, safety and social opportunities."},{"id":3,"module":"wellbeing","title":"Material and non-material wellbeing","paragraphs":["Human wellbeing includes both material and non-material dimensions. Material wellbeing refers to physical resources and living conditions that people can access. Examples include income, food, housing, transport, electricity, healthcare, clothing and technology. These resources matter because they help people meet their needs and participate in everyday life.","Non-material wellbeing refers to important parts of life that are not mainly about possessions or money. These include relationships, safety, identity, freedom, respect, belonging, purpose, cultural connection and the ability to practise beliefs. These things can have a powerful effect on quality of life even though they are difficult to measure in dollars.","The two dimensions are connected. A stable income may help a family access safe housing, but housing alone does not guarantee that people feel secure or connected. A strong community can provide emotional support even when income is limited. A government may improve material living conditions through infrastructure, while people may still experience discrimination or political exclusion.","A strong understanding of wellbeing therefore looks beyond wealth. Money and services matter, but so do dignity, identity, connection and freedom."],"terms":[{"term":"material wellbeing","meaning":"resources, possessions and living conditions"},{"term":"non-material wellbeing","meaning":"relationships, identity, freedom, purpose and belonging"},{"term":"dignity","meaning":"the right to be treated with respect and worth"}],"challenge":"Sort: safe housing, friendship, income, identity, healthcare, freedom, electricity, cultural connection. Which examples affect both material and non-material wellbeing?","question":"Why is income alone an incomplete measure of wellbeing?","answer":"Because income does not directly measure relationships, identity, freedom, safety, purpose, culture or many other non-material aspects of life."},{"id":4,"module":"wellbeing","title":"The seven factors of human wellbeing","paragraphs":["Human wellbeing can be organised into seven major factors. Physical wellbeing is about health and the basic conditions needed to stay healthy, including clean water, nutritious food, healthcare, safe housing and sanitation. Economic wellbeing is about income, employment and financial security. Social wellbeing focuses on relationships, support networks, community participation and connection with others.","Environmental wellbeing is shaped by the quality and safety of the natural and built environment. Clean air, safe water, green space and protection from hazards can improve wellbeing, while pollution, disasters and unsafe surroundings can reduce it. Mental and emotional wellbeing includes the ability to cope with stress, maintain a positive sense of self and experience purpose and emotional stability.","Cultural and spiritual wellbeing is linked to identity, traditions, language, beliefs and connection to culture or faith. Political wellbeing relates to rights, freedom, representation and the ability to participate in decisions that affect people’s lives.","These factors are not separate boxes. They overlap. A person who loses a job may experience economic stress, which can affect housing, physical health, mental health and family relationships. This is why wellbeing should be understood as a connected system rather than a checklist."],"terms":[{"term":"physical","meaning":"health and basic conditions for health"},{"term":"economic","meaning":"income, employment and financial security"},{"term":"social","meaning":"relationships and community support"},{"term":"environmental","meaning":"quality and safety of the environment"},{"term":"mental & emotional","meaning":"coping, self-image and emotional health"},{"term":"cultural & spiritual","meaning":"identity, traditions and beliefs"},{"term":"political","meaning":"rights, freedom and participation"}],"challenge":"Create one real-life example for each factor. Then choose one example that could affect at least three factors at once.","question":"A young person has supportive friends and education staff. Which factor is most direct?","answer":"Social wellbeing, although the support can also improve mental and emotional wellbeing."},{"id":5,"module":"wellbeing","title":"How wellbeing factors interact","paragraphs":["One of the most important ideas in this topic is that wellbeing factors influence each other. Imagine a person who develops a serious illness. Their physical wellbeing is affected first, but the impact may spread further. They may be unable to work, which reduces income and affects economic wellbeing. Financial pressure may increase stress and reduce mental wellbeing. They may spend less time with friends and community, affecting social wellbeing.","The same connection can work positively. Good education can improve employment opportunities. Stable employment can increase income. Higher income can improve access to housing, healthy food and healthcare. Feeling secure can reduce stress and make it easier to participate in social and cultural activities.","This is why explanations in Geography should show cause and effect. It is not enough to say that income affects wellbeing. A stronger explanation shows how stable income can help people afford basic needs and services, which can improve physical security, reduce stress and increase opportunities.","When analysing wellbeing, always ask two questions: what factor is directly affected, and what other factors could be affected next?"],"terms":[{"term":"enhance","meaning":"improve or strengthen"},{"term":"hinder","meaning":"reduce or make more difficult"},{"term":"cause and effect","meaning":"how one condition leads to another outcome"}],"challenge":"Choose job loss, good education, pollution or supportive friendships. Build a four-step wellbeing domino chain.","question":"What makes an explanation stronger than simply naming a factor?","answer":"A strong explanation shows the example, the effect and how the effect changes quality of life."},{"id":6,"module":"wellbeing","title":"Opportunity, advantage and unequal starting points","paragraphs":["People do not all begin life with the same opportunities or barriers. Some people grow up with stable housing, strong schools, healthcare, financial security and supportive networks. Others may experience poverty, discrimination, conflict, disability, poor infrastructure or limited access to services. These differences can shape wellbeing even when people work equally hard.","An advantage is a condition that makes access or success easier. A disadvantage is a condition that creates barriers. Privilege refers to advantages a person may have because of social, economic or political circumstances. These ideas do not mean that individual effort is unimportant. They mean that effort takes place within different conditions.","For example, two people may be equally motivated, but one has reliable internet, a quiet study space and family support, while the other works after school and shares a crowded home. Their effort may be similar, but their opportunities are not identical.","Understanding unequal starting points helps explain why wellbeing outcomes differ between people and places. It also leads into regional disparities, where access to resources and opportunities varies geographically."],"terms":[{"term":"opportunity","meaning":"a chance to access something or achieve an outcome"},{"term":"advantage","meaning":"a condition that makes success easier"},{"term":"disadvantage","meaning":"a condition that creates barriers"},{"term":"privilege","meaning":"an advantage linked to a person’s circumstances"}],"challenge":"Explain why equal effort does not always produce equal outcomes. Use one school-based or community-based example.","question":"Does recognising unequal starting points mean individual effort does not matter?","answer":"No. It means effort happens within different social, economic and geographical conditions."},{"id":7,"module":"disparities","title":"What regional disparities are","paragraphs":["Regional disparities are differences in quality of life, opportunity and access to resources between places. A region might be a country, a state, a city, a rural area or even a neighbourhood. When one place has better access to hospitals, schools, jobs, transport, clean water or safe housing than another, a disparity exists.","These differences can be caused by many factors. Economic conditions matter because wealthier regions often have more investment and employment. Infrastructure matters because roads, electricity, internet and public transport affect access to services. Education and healthcare can vary between regions. Environmental conditions such as drought, pollution, natural hazards and climate can also shape wellbeing.","Regional disparities are important because they create unequal life chances. A child’s opportunities may be influenced by where they are born or where their family can afford to live. Geographers study these patterns because wellbeing is not evenly distributed across space.","The key question is not only “Which place is better off?” but also “Why are the differences there, who is affected, and what could reduce the gap?”"],"terms":[{"term":"regional disparity","meaning":"a significant difference between places"},{"term":"infrastructure","meaning":"roads, water, electricity, internet and other basic systems"},{"term":"spatial distribution","meaning":"the pattern of where something is located"}],"challenge":"Compare an urban and a rural area. List three services that may differ and explain how one difference could affect wellbeing.","question":"What makes a difference between two places a geographical disparity?","answer":"It becomes a geographical disparity when access, conditions or outcomes vary spatially between places."},{"id":8,"module":"disparities","title":"Income and employment disparities","paragraphs":["Income and employment strongly influence economic wellbeing because they affect the resources people can access. Stable employment can provide money for food, housing, transport, healthcare, education and recreation. It can also provide routine, security, social contact and a sense of purpose.","When income is low or employment is insecure, people may have to make difficult choices between essential expenses. A family may delay medical treatment, move into cheaper housing or reduce spending on healthy food. Financial pressure can also affect mental health and family relationships.","However, average income must be interpreted carefully. A country can have a high average income while wealth is concentrated among a small group. A suburb can contain both high-income and low-income households. This means averages can hide inequality.","When comparing income between places, do not simply say that higher income means higher wellbeing. Explain the pathway: higher or more stable income can improve access to needs and opportunities, but wellbeing also depends on health, relationships, environment, culture and rights."],"terms":[{"term":"income disparity","meaning":"difference in income between people or places"},{"term":"financial security","meaning":"reliable ability to meet expenses"},{"term":"inequality","meaning":"unequal distribution of resources or opportunities"}],"challenge":"Compare two countries or regions using income data. Explain two possible wellbeing effects and one limitation of using an average.","question":"Why can a high average income be misleading?","answer":"Because it may hide large differences between rich and poor groups within the same place."},{"id":9,"module":"disparities","title":"Education disparities","paragraphs":["Education disparities occur when people in different places have unequal access to schooling, different years of education or different quality of education. Education influences wellbeing because it develops literacy, knowledge and skills that can improve employment opportunities and income.","Education also supports decision-making. People who can access reliable information are often better able to understand healthcare advice, manage finances, participate in government and advocate for their rights. At a community level, education can support economic development and improve public awareness of health and environmental issues.","The number of years spent in school is one useful measure, but it does not tell us everything. Two countries may have similar average years of schooling but very different school quality, class sizes, staff availability or access for girls, rural people or people with disability.","A good geographical explanation therefore connects education to opportunity while recognising that quantity and quality are not the same thing."],"terms":[{"term":"educational disparity","meaning":"unequal access to or outcomes from education"},{"term":"average years of schooling","meaning":"average years of education completed"},{"term":"empowerment","meaning":"gaining knowledge or power to make decisions"}],"challenge":"Compare two places using years of schooling. Explain how the difference could affect employment, health knowledge and political participation.","question":"Why can years of schooling be useful but incomplete?","answer":"Because it measures time in education but not necessarily the quality, safety or inclusiveness of that education."},{"id":10,"module":"disparities","title":"Environmental and pollution disparities","paragraphs":["The environment can strongly influence wellbeing. Clean air, safe water, green space and protection from hazards can support physical and mental health. Pollution, unsafe water, extreme heat, flooding or bushfires can reduce quality of life and create long-term health and economic costs.","Air pollution is a useful example. Polluted air can contribute to breathing problems, heart disease and reduced ability to exercise outdoors. It can also increase healthcare costs and lead to missed work or school. Environmental damage can affect crops, forests and food production.","Environmental disparities occur because exposure is not equal. Some communities live closer to busy roads, industrial areas or polluted waterways. Others may have better access to parks, clean transport and environmental protections.","When we study an environmental disparity, we should look at both exposure and vulnerability. Two communities may experience the same hazard, but the one with weaker housing, healthcare or emergency services may suffer greater harm."],"terms":[{"term":"environmental disparity","meaning":"unequal environmental quality or hazard exposure"},{"term":"exposure","meaning":"contact with a hazard"},{"term":"vulnerability","meaning":"how likely people are to be harmed"},{"term":"AQI","meaning":"Air Quality Index"}],"challenge":"Build a chain: pollution source → exposure → health effect → economic or social effect.","question":"What is the difference between exposure and vulnerability?","answer":"Exposure is contact with a hazard; vulnerability is how likely people are to be harmed by it."},{"id":11,"module":"disparities","title":"Happiness and subjective wellbeing","paragraphs":["Not every part of wellbeing can be measured with income, years of schooling or life expectancy. Happiness and life satisfaction are examples of subjective wellbeing because they are based on how people feel and evaluate their own lives.","Subjective wellbeing can be influenced by income and services, but also by relationships, trust, safety, freedom, culture, expectations and purpose. This explains why two people with similar material living conditions may report very different levels of happiness.","Countries with strong healthcare, education, social support and political stability often perform well in happiness measures, but this does not mean every person in those countries is happy. National averages can hide differences between groups.","The important point is that objective and subjective measures should be used together. Objective data tells us about living conditions. Subjective data tells us how people experience those conditions. Both are useful, but neither is complete on its own."],"terms":[{"term":"subjective wellbeing","meaning":"a person’s own evaluation of their life"},{"term":"objective indicator","meaning":"a measurable condition"},{"term":"life satisfaction","meaning":"how positively a person evaluates life overall"}],"challenge":"Give one reason development may increase happiness and one reason a wealthy country could still contain people with low subjective wellbeing.","question":"Why should geographers use both objective and subjective measures?","answer":"Because objective data shows living conditions while subjective data shows how people experience those conditions."},{"id":12,"module":"disparities","title":"Common spatial patterns and solutions","paragraphs":["Regional disparities often follow recognisable patterns. Urban and rural areas may differ because cities usually have more hospitals, universities, public transport and employment options, while rural areas may have stronger community networks but longer travel distances to services.","Developed and developing countries may differ in average income, infrastructure, healthcare and education, although there is enormous variation within both groups. Coastal and inland areas may differ because ports, tourism and major cities are often concentrated near coasts, while inland communities may face transport, climate or service-access challenges.","Disparities also exist within a single city. Some suburbs may have higher incomes, better schools, more green space and better transport than others.","When explaining a spatial disparity, avoid stereotypes. Describe the actual pattern, provide evidence, explain the causes and then link the pattern to wellbeing. A useful structure is: where is the disparity, what is different, why is it different, and what could reduce the gap?"],"terms":[{"term":"urban","meaning":"city-based"},{"term":"rural","meaning":"countryside or low-density settlement"},{"term":"coastal","meaning":"near the coast"},{"term":"inland","meaning":"away from the coast"}],"challenge":"Choose urban–rural, developed–developing, coastal–inland or differences within one city. Identify two causes, two wellbeing impacts and two realistic responses.","question":"What should a strong disparity explanation include?","answer":"The spatial pattern, evidence, causes, impacts on wellbeing and a realistic response."},{"id":13,"module":"measurement","title":"Why we measure human wellbeing","paragraphs":["Geographers measure human wellbeing so they can compare places, identify patterns, monitor change and decide where support or investment may be needed. A single story can tell us a great deal about one person, but it cannot describe an entire country. Indicators help us look at larger patterns.","An indicator is a measurable piece of information, such as life expectancy, years of schooling, income or access to clean water. An index combines several indicators into one overall measure. Indexes are useful because they simplify complex information, but this simplification also creates limitations.","No measure can capture every part of wellbeing. A country may perform strongly in health and education but have serious inequality, discrimination or environmental problems. For this reason, geographers compare several indicators and ask what the data includes and what it leaves out.","Measurement is therefore not just about ranking countries. It is about using evidence carefully to understand people’s lives."],"terms":[{"term":"indicator","meaning":"a measurable piece of data"},{"term":"index","meaning":"a combined measure made from several indicators"},{"term":"data","meaning":"information collected for analysis"}],"challenge":"Design your own wellbeing index using five indicators. Explain why each one matters.","question":"Why do geographers use more than one indicator?","answer":"Because wellbeing is multidimensional and one indicator cannot capture all important conditions."},{"id":14,"module":"measurement","title":"The Human Development Index","paragraphs":["The Human Development Index, or HDI, was created to shift attention away from economic growth alone and toward people’s capabilities and opportunities. It combines three dimensions: health, education and standard of living.","Health is measured using life expectancy at birth. Education is measured using two indicators: mean years of schooling for adults and expected years of schooling for children entering school. Standard of living is measured using Gross National Income, or GNI, per person.","The indicators are combined into a score between 0 and 1. A score closer to 1 represents higher average human development. The HDI is useful because it allows broad comparison between countries, but it is still an average. It does not directly show inequality, poverty, human security, environmental quality or political freedom.","A strong explanation of HDI should therefore do two things: explain what it measures and recognise what it cannot measure."],"terms":[{"term":"HDI","meaning":"Human Development Index"},{"term":"life expectancy at birth","meaning":"average years a newborn is expected to live"},{"term":"mean years of schooling","meaning":"average schooling completed by adults"},{"term":"expected years of schooling","meaning":"schooling a child can expect to receive"},{"term":"GNI per capita","meaning":"Gross National Income divided by population"}],"challenge":"Match health, education and standard of living with the correct indicators. Explain why income alone would be incomplete.","question":"What are the three HDI dimensions?","answer":"Health, education and standard of living."},{"id":15,"module":"measurement","title":"Low human development as connected disadvantage","paragraphs":["Low human development usually results from several disadvantages occurring at the same time. Consider a country affected by prolonged conflict. Conflict can damage hospitals, schools, roads and water systems. Health services become harder to access, education staff and health workers may leave, and families may be displaced.","These conditions affect the HDI dimensions directly. Poor healthcare can reduce life expectancy. School closures and displacement can reduce years of education. Economic disruption can reduce income and employment. Food insecurity and poverty can make each of these problems worse.","The important idea is that low HDI is rarely caused by one factor. It is usually the result of connected systems. Conflict can reduce education, which can reduce future employment, which can lower income, which can reduce access to healthcare.","When analysing a low-HDI case, build a cause-and-effect chain rather than listing disconnected facts."],"terms":[{"term":"conflict","meaning":"violent disruption or war"},{"term":"food insecurity","meaning":"unreliable access to sufficient nutritious food"},{"term":"displacement","meaning":"being forced to leave home"},{"term":"development outcome","meaning":"a result affecting health, education or living standards"}],"challenge":"Build a chain starting with conflict and ending with an HDI outcome. Include at least four steps.","question":"Why is low HDI usually not caused by one issue?","answer":"Because health, education, income, conflict, infrastructure and other conditions interact."},{"id":16,"module":"measurement","title":"Comparing countries with wellbeing data","paragraphs":["Country comparisons are useful when they use the same indicators and the same year of data. A good comparison does not simply list numbers. It explains what the numbers mean for people’s lives.","If one country has much higher life expectancy, possible reasons might include stronger healthcare, safer water, better nutrition or lower conflict. If years of schooling differ, this may affect skills, employment and future income. If income differs greatly, access to housing, healthcare and transport may also differ.","However, comparisons must be careful. A national average can hide regional differences. Current events such as war, economic crisis or migration can change conditions quickly. Data from different years can also create misleading comparisons.","Use this structure: state the difference, support it with data, explain the likely wellbeing effect, and identify one limitation of the comparison."],"terms":[{"term":"comparison","meaning":"examining similarities and differences using evidence"},{"term":"national average","meaning":"one average value for a whole country"},{"term":"reliability","meaning":"how dependable information is"}],"challenge":"Compare two countries using life expectancy, schooling and income. For each indicator, explain one likely wellbeing effect.","question":"What is one common mistake when comparing countries?","answer":"Listing numbers without explaining what the differences mean for people’s lives."},{"id":17,"module":"measurement","title":"Wealth distribution and inequality","paragraphs":["A country can be wealthy overall while many people still experience low wellbeing. This happens when income and wealth are distributed unevenly. If a small group controls a large share of resources, national averages may look strong even though many households have limited access to housing, healthcare or education.","This is why distribution matters as well as totals. Imagine two countries with the same average income. In one country, most people earn close to the average. In the other, a small wealthy group earns extremely high incomes while many people earn very little. The average may be similar, but everyday wellbeing is very different.","Inequality can also occur between regions, genders, age groups or cultural groups. Measuring wellbeing therefore requires looking beneath national averages.","The key question is not simply “How much wealth does a country have?” but “Who has access to that wealth and the opportunities it creates?”"],"terms":[{"term":"wealth distribution","meaning":"how wealth is shared across a population"},{"term":"income inequality","meaning":"unequal distribution of income"},{"term":"average","meaning":"a central value that may hide variation"}],"challenge":"Create two imaginary countries with the same average income but different distributions. Explain why wellbeing could differ.","question":"Why can national averages hide inequality?","answer":"Because a single average does not show how resources are distributed between people or regions."},{"id":18,"module":"measurement","title":"Strengths and limitations of HDI","paragraphs":["HDI is useful because it is simple, widely recognised and broader than income alone. By combining health, education and standard of living, it gives a quick overview of average human development and allows countries to be compared over time.","However, HDI has important limitations. It is a national average, so it can hide inequality between regions or groups. It does not directly measure political freedom, environmental quality, cultural wellbeing, happiness, safety or gender equality. Two countries can have similar HDI scores but very different social conditions.","This does not make HDI useless. It means it should be treated as one tool among many. A careful geographer uses HDI as a starting point and then looks at other evidence.","A strong evaluation therefore includes a judgement: HDI is useful for broad comparison, but it should not be treated as a complete picture of wellbeing."],"terms":[{"term":"strength","meaning":"a feature that makes a measure useful"},{"term":"limitation","meaning":"a weakness that reduces usefulness"},{"term":"evaluation","meaning":"a judgement based on evidence"}],"challenge":"Write one strength, two limitations and a final judgement beginning: ‘Overall, HDI is useful because…, but…’","question":"What is the biggest reason HDI should not be used alone?","answer":"It is an average of only three dimensions and therefore cannot capture every inequality or aspect of wellbeing."},{"id":19,"module":"measurement","title":"Broader wellbeing measures and country profiles","paragraphs":["Because wellbeing is multidimensional, broader frameworks can add information that HDI leaves out. The OECD wellbeing framework includes areas such as housing, jobs, health, education, environment, safety, community relationships and life satisfaction. These measures help us understand how people experience life beyond income and formal education.","A country profile combines several types of evidence. Useful information can include population, languages, religions, industries, education, major geographical features, current issues and recent news. The purpose is not to collect random facts. Each fact should help explain the country’s opportunities, challenges or wellbeing patterns.","Current news is particularly useful because statistics can change slowly while major events can affect wellbeing quickly. Conflict, natural disasters, elections, economic changes and health crises can all alter conditions.","The best country profile combines statistics, geographical context and current evidence, then explains how these shape human wellbeing."],"terms":[{"term":"wellbeing framework","meaning":"a set of dimensions used to organise wellbeing"},{"term":"country profile","meaning":"a structured summary of a country"},{"term":"current issue","meaning":"a recent or ongoing event affecting a place"}],"challenge":"Choose one country. Collect one piece of evidence for health, education, income, environment, culture and a current issue.","question":"Why is a country profile stronger when it combines statistics and current news?","answer":"Statistics show broader patterns, while current news adds recent context and events affecting wellbeing."},{"id":20,"module":"sustainable","title":"What sustainable development means","paragraphs":["Sustainable development means improving people’s lives today without reducing the ability of future generations to meet their own needs. The idea is based on balance. Development can create jobs, housing, roads, energy and services, but it can also damage ecosystems or use resources faster than they can recover.","A sustainable decision considers economic, social and environmental outcomes together. A new industry may create employment and income, which improves economic wellbeing. But if it pollutes a river, it may reduce physical and environmental wellbeing. A more sustainable approach would create jobs while also protecting water quality.","Sustainability is therefore not about stopping development. It is about asking whether development can continue over time without causing unacceptable harm.","The central question is: can this decision improve wellbeing now and still leave future generations with healthy environments, resources and opportunities?"],"terms":[{"term":"sustainable development","meaning":"meeting present needs without reducing future generations’ ability to meet theirs"},{"term":"future generations","meaning":"people who will live in the future"},{"term":"trade-off","meaning":"a benefit in one area that may create a cost elsewhere"}],"challenge":"Choose a road, mine, housing estate or farm. Identify one benefit, one risk and one change that would make it more sustainable.","question":"Does sustainable development mean stopping all development?","answer":"No. It means balancing present development with long-term social, economic and environmental wellbeing."},{"id":21,"module":"sustainable","title":"From the MDGs to the SDGs","paragraphs":["The Millennium Development Goals, or MDGs, were a global development framework used from 2000 to 2015. They focused strongly on extreme poverty and basic human needs such as health and education.","In 2015, the United Nations adopted the Sustainable Development Goals, or SDGs, as part of the 2030 Agenda. The SDGs expanded the focus. They still address poverty, hunger, health and education, but they also include inequality, climate change, sustainable cities, clean energy, peace, responsible consumption and ecosystem protection.","The shift from MDGs to SDGs shows that development is now understood more broadly. Human wellbeing depends on social, economic and environmental systems working together.","The SDGs apply to all countries, not only lower-income countries. Australia still faces challenges involving inequality, housing, climate, sustainable cities and environmental protection."],"terms":[{"term":"MDGs","meaning":"Millennium Development Goals, 2000–2015"},{"term":"SDGs","meaning":"17 Sustainable Development Goals adopted in 2015"},{"term":"2030 Agenda","meaning":"the UN framework for achieving the SDGs by 2030"}],"challenge":"Write two ways the SDGs are broader than the MDGs.","question":"Why do the SDGs apply to wealthy countries as well as poorer countries?","answer":"Because every country faces social, economic and environmental sustainability challenges."},{"id":22,"module":"sustainable","title":"The 17 SDGs as a connected system","paragraphs":["The 17 Sustainable Development Goals address different parts of human wellbeing and environmental sustainability. They include ending poverty and hunger, improving health and education, achieving gender equality, providing clean water and energy, supporting decent work, reducing inequality, building sustainable cities, taking climate action and protecting ecosystems.","The goals are interconnected. Improving clean water can improve health and school attendance. Better education can improve employment and income. Sustainable cities can improve transport, air quality and safety. Climate action can protect food security, housing and health.","Progress in one goal can support progress in others. The reverse is also true. Failure in one area can create problems elsewhere.","When analysing an SDG, do not treat it as an isolated target. Ask which wellbeing factors it affects and which other goals it connects to."],"terms":[{"term":"interconnected","meaning":"linked so changes in one area affect another"},{"term":"target","meaning":"a specific result a goal aims to achieve"},{"term":"global goal","meaning":"an internationally agreed objective"}],"challenge":"Choose one SDG and draw arrows to at least three other SDGs it could influence. Explain each connection.","question":"Give one example of how progress on one SDG can support another.","answer":"For example, clean water can improve health and school attendance, supporting both SDG 3 and SDG 4."},{"id":23,"module":"sustainable","title":"Evaluating progress toward an SDG","paragraphs":["To evaluate progress toward a Sustainable Development Goal, we need more than a description of the goal. We need evidence of action and evidence of change.","If a government says it is working toward clean water and sanitation, we can ask what policies or projects have been introduced, how many people gained access to safe water, and whether water quality improved. We should also ask whether benefits reached rural and disadvantaged communities.","Comparison can strengthen evaluation. Two countries may pursue the same goal using different strategies. One may focus on infrastructure, while another focuses on regulation or community programs.","A strong evaluation follows this pattern: identify the goal, describe the action, provide evidence of progress, explain the wellbeing effect, and make a judgement about how effective the action appears to be."],"terms":[{"term":"policy","meaning":"a planned course of action"},{"term":"progress","meaning":"movement toward a goal"},{"term":"effectiveness","meaning":"how well an action achieves its result"}],"challenge":"Choose one SDG. Find one action from Australia and one from another country. Decide which appears more effective and justify your judgement.","question":"What is the difference between describing an action and evaluating it?","answer":"Evaluation uses evidence to judge how effective the action has been."},{"id":24,"module":"sustainable","title":"Using development data to explain differences","paragraphs":["Human development data becomes most useful when it is used to explain differences between places. Imagine two countries with very different HDI scores. A strong comparison uses evidence from health, education and income, then explains how the differences affect people’s lives.","Higher life expectancy may reflect stronger healthcare, nutrition or sanitation. More years of schooling may create greater employment opportunities. Higher income may improve access to housing and services. The goal is not to label one country as simply “good” and another as “bad”. The goal is to explain the conditions that produce different outcomes.","Data should also be treated as evidence from a particular time. Development indicators change, and countries can improve or decline.","A useful comparison therefore includes numbers, explanation and caution. It shows what the data suggests without pretending that one score can describe every person."],"terms":[{"term":"human development data","meaning":"evidence about health, education and living standards"},{"term":"evidence-based comparison","meaning":"a comparison supported by data"},{"term":"context","meaning":"conditions that help explain the data"}],"challenge":"Choose two countries. Use three indicators and explain the likely wellbeing effect of each difference.","question":"Why should we avoid labelling one whole country as simply ‘good’ or ‘bad’?","answer":"Because national averages hide diversity and wellbeing is shaped by many conditions."},{"id":25,"module":"poverty","title":"What poverty means","paragraphs":["Poverty is a condition in which people do not have enough resources to achieve an acceptable standard of living. Poverty can affect food, housing, healthcare, education, transport, safety and participation in society.","Poverty is closely connected to human wellbeing because lacking resources can create problems across several dimensions at once. Low income may reduce access to healthy food and medical care. Poor housing can affect physical health. Financial stress can affect mental wellbeing. Limited education can reduce future employment opportunities.","Poverty is not only about income. It can also involve deprivation, which means lacking important goods, services or opportunities.","When studying poverty, we need to ask what people can actually access and whether they are able to meet basic needs and participate in the society around them."],"terms":[{"term":"poverty","meaning":"insufficient resources for an acceptable standard of living"},{"term":"deprivation","meaning":"lack of important resources or opportunities"},{"term":"standard of living","meaning":"the material conditions in which people live"}],"challenge":"Choose one missing resource, such as housing or food, and explain how it could affect three wellbeing factors.","question":"Why is poverty more than low income?","answer":"Because people can also lack services, housing, healthcare, education, safety and opportunities."},{"id":26,"module":"poverty","title":"Absolute and relative poverty","paragraphs":["Absolute poverty refers to severe deprivation where people cannot consistently meet basic necessities such as food, clean water, shelter, clothing and essential healthcare. The focus is on whether people can meet minimum needs for survival and health.","Relative poverty is different. It compares a person’s living standard with the normal standard in the society around them. Someone may have food and shelter but still have far fewer resources than most people in their country. This can make it difficult to participate in normal social activities, access transport, use technology or provide children with the same opportunities as others.","Relative poverty is especially important in developed countries because people can experience serious disadvantage even when they are not in extreme poverty.","For global comparison, the World Bank uses an international extreme-poverty line. In June 2025, this was updated to US$3.00 per person per day using 2021 purchasing-power-parity dollars. National poverty lines are usually more appropriate for understanding poverty within a specific country."],"terms":[{"term":"absolute poverty","meaning":"basic necessities cannot be consistently met"},{"term":"relative poverty","meaning":"living well below the typical standard of one’s society"},{"term":"poverty line","meaning":"an income threshold used to measure poverty"},{"term":"PPP","meaning":"purchasing power parity"}],"challenge":"Create one scenario of absolute poverty and one scenario of relative poverty. Underline the evidence that proves each classification.","question":"What is the key difference between absolute and relative poverty?","answer":"Absolute poverty focuses on basic necessities; relative poverty compares living standards with the society around a person."},{"id":27,"module":"poverty","title":"Causes of poverty and the poverty trap","paragraphs":["Poverty can be caused by unemployment, low wages, limited education, poor health, conflict, discrimination, disasters, weak infrastructure or unequal access to land and services. Often these causes interact.","A poverty trap is a cycle that makes poverty difficult to escape. Imagine a family with very low income. They may be unable to afford transport or education. Limited education can reduce access to better-paid work. Low income then continues into the next stage of life.","Health can create a similar cycle. Poor nutrition and weak healthcare can reduce a person’s ability to work or study. Lower productivity reduces income, which makes healthcare and healthy food even harder to afford.","Breaking a poverty trap often requires more than one solution. Income support, education, healthcare, infrastructure and employment opportunities may need to work together."],"terms":[{"term":"poverty trap","meaning":"a self-reinforcing cycle that keeps people in poverty"},{"term":"low wage","meaning":"pay that provides limited income"},{"term":"structural cause","meaning":"a broader social or economic condition creating disadvantage"}],"challenge":"Create a four-step poverty trap using low income, education, health or employment. Identify one intervention that could break the cycle.","question":"Why can one solution be insufficient to break a poverty trap?","answer":"Because poverty often involves several connected causes that reinforce each other."},{"id":28,"module":"poverty","title":"Disadvantage in Australia","paragraphs":["Disadvantage in Australia can be financial, social, geographical, educational or health-related. Financial disadvantage limits the ability to afford housing, food, transport and services. Social disadvantage can involve isolation, discrimination or weak support networks.","People in rural and remote communities may face longer distances to healthcare, education and employment. People living with disability or mental illness may face barriers to participation. Newly arrived migrants may face language or employment barriers. Aboriginal and Torres Strait Islander peoples can experience disadvantage linked to the ongoing effects of colonisation, discrimination and unequal access to services.","It is important to describe these as patterns of risk, not assumptions about individuals. Membership of a group does not automatically mean a person has low wellbeing.","The geographical question is: which barriers exist, where are they located, who is most affected, and what policies could improve access and inclusion?"],"terms":[{"term":"financial disadvantage","meaning":"limited economic resources"},{"term":"social disadvantage","meaning":"barriers to inclusion or participation"},{"term":"social inclusion","meaning":"being able to participate fully in community life"},{"term":"barrier","meaning":"something making access harder"}],"challenge":"Explain why it is better to say a group may face a higher risk of disadvantage than to assume every person in that group is disadvantaged.","question":"Why is avoiding stereotypes important when discussing disadvantage?","answer":"Because groups are diverse and risk patterns do not describe every individual."},{"id":29,"module":"poverty","title":"NGOs and improving wellbeing","paragraphs":["A non-governmental organisation, or NGO, is an organisation that operates independently from direct government control and works on issues such as health, humanitarian aid, education, poverty, environment or human rights.","NGOs can improve wellbeing in many ways. They may provide emergency food and shelter, build water systems, support schools, deliver healthcare, protect rights or provide training and employment support. The most important step is connecting the action to the wellbeing outcome.","A clean-water project does more than provide water. It can reduce disease, save time spent collecting water, improve school attendance and reduce medical costs. One action can therefore influence physical, economic, social and educational wellbeing.","When evaluating an NGO, ask what problem it addresses, who it supports, what action it takes and what evidence shows that the action improves wellbeing."],"terms":[{"term":"NGO","meaning":"non-governmental organisation"},{"term":"humanitarian","meaning":"focused on reducing suffering"},{"term":"intervention","meaning":"an action taken to improve a problem"}],"challenge":"Choose an NGO. Write: problem → NGO action → immediate result → wellbeing outcome.","question":"What makes an NGO evaluation stronger than simply listing what the NGO does?","answer":"It explains who benefits, how the action changes conditions and what evidence shows improved wellbeing."},{"id":30,"module":"poverty","title":"A complex wellbeing case: Democratic Republic of the Congo","paragraphs":["The Democratic Republic of the Congo is a useful case because several wellbeing challenges can occur at the same time. Conflict can displace communities, damage schools and hospitals, disrupt farming and make transport dangerous. Poverty can limit access to food, healthcare and education. Disease and poor sanitation can further reduce physical wellbeing.","These issues are interconnected. Conflict can reduce food production, which increases food insecurity. Food insecurity can weaken health. Poor health can reduce school attendance and work. Low education and employment can then make poverty harder to escape.","A strong geographical case study uses several types of evidence: HDI, life expectancy, education, child mortality, income, maps, graphs and recent news. It also considers solutions rather than only describing problems.","When proposing a solution, connect it directly to the cause. If unsafe water is the problem, a relevant response might involve water infrastructure, sanitation and local maintenance. If conflict is disrupting schooling, education support must also consider safety and displacement."],"terms":[{"term":"food security","meaning":"reliable access to enough safe and nutritious food"},{"term":"child mortality","meaning":"deaths of children, often under age five"},{"term":"civil conflict","meaning":"armed conflict within a country"},{"term":"complex challenge","meaning":"a problem created by several interacting causes"}],"challenge":"Choose one issue: food security, sanitation, disease, conflict, child soldiers, poverty or disasters. Define it, give evidence, explain the wellbeing impact and recommend one response.","question":"Why should a solution be linked directly to a cause?","answer":"Because a response is more effective when it targets the process creating the problem."},{"id":31,"module":"population","title":"How to read a population pyramid","paragraphs":["A population pyramid is a graph showing the age and sex structure of a population. Age groups are shown vertically, usually from the youngest at the bottom to the oldest at the top. Males are usually shown on one side and females on the other. The horizontal axis shows either the number or percentage of people in each group.","The shape gives clues about population structure. A wide base means there are many children. A wide middle means there is a large working-age population. A wider upper section means there are more older people.","Before making any interpretation, always read the title, year, axes and units. A graph using percentages may look different from one using total numbers.","Population pyramids are useful because they help governments plan schools, hospitals, aged care, housing and employment. They do not tell us everything about wellbeing, but they reveal important demographic pressures."],"terms":[{"term":"population pyramid","meaning":"a graph showing age and sex structure"},{"term":"age distribution","meaning":"how people are spread across age groups"},{"term":"sex distribution","meaning":"relative numbers of males and females"},{"term":"x-axis","meaning":"horizontal axis"},{"term":"y-axis","meaning":"vertical axis"}],"challenge":"For any pyramid, identify the year, units, male/female sides, youngest group, oldest group and widest group before interpreting it.","question":"What should you check before interpreting the shape?","answer":"The title, year, axes, units, male/female sides and age groups."},{"id":32,"module":"population","title":"Population pyramid shapes","paragraphs":["A triangular population pyramid has a wide base and narrows quickly with age. This usually suggests a youthful population with high birth rates and relatively few older people. Governments may need to invest heavily in schools, child health services and future employment.","A barrel or beehive shape has a broad working-age middle and a narrower base. This can suggest falling birth rates and an ageing population. A more rectangular shape shows relatively similar proportions across many age groups and may indicate a more stable population structure.","These shapes are simplified models. Real populations rarely match them perfectly. Migration, war, baby booms, disease and government policy can create unusual bulges or gaps.","Use cautious language such as “suggests” or “may indicate”. A graph supports an inference, but it does not prove the cause by itself."],"terms":[{"term":"youthful population","meaning":"a population with many children and young people"},{"term":"ageing population","meaning":"a population with an increasing share of older people"},{"term":"inference","meaning":"a conclusion drawn from evidence"}],"challenge":"Match triangular, barrel and rectangular shapes to likely government service needs. Explain one match.","question":"Why should we say a pyramid ‘suggests’ a cause rather than ‘proves’ it?","answer":"Because the graph shows structure, but other evidence is needed to prove why that structure exists."},{"id":33,"module":"population","title":"How population structure affects wellbeing","paragraphs":["Population structure affects the services a country needs. A youthful population creates high demand for schools, education staff, vaccination, maternal health and eventually employment. If governments cannot keep up with this demand, education and health outcomes may suffer.","An ageing population creates different needs. More people may require healthcare, aged care, accessible transport and pension support. At the same time, a smaller working-age population may have to support a larger number of retirees.","A large working-age population can support economic growth because more people are potentially employed and paying taxes. However, this only becomes an advantage if jobs, housing and infrastructure are available.","Population pyramids therefore help connect demographic patterns with human wellbeing. Governments can use the information to plan services before pressures become severe."],"terms":[{"term":"dependency","meaning":"reliance on workers or public support"},{"term":"labour force","meaning":"people working or available for work"},{"term":"policy planning","meaning":"using evidence to plan services"}],"challenge":"Choose a youthful, ageing or working-age-heavy population. Recommend two policies and explain how each could improve wellbeing.","question":"Why is a large working-age population not automatically an economic advantage?","answer":"Because jobs, housing, infrastructure and services must be available for people to participate productively."},{"id":34,"module":"population","title":"Australia: ageing, migration and future planning","paragraphs":["Australia’s population is ageing, which means older age groups are becoming a larger share of the population. This is influenced by longer life expectancy and lower birth rates. Migration also shapes Australia’s population because many migrants arrive during working ages.","An ageing population increases demand for healthcare, aged care and accessible housing. It also raises questions about pensions, workforce participation and the number of workers available to support services through taxation.","Population projections help governments plan, but they are not predictions. They show what could happen if assumptions about births, deaths and migration continue.","When interpreting a future Australian population pyramid, look for the size of older age groups, the width of the base and the working-age population. Then connect the pattern to likely policy needs."],"terms":[{"term":"population projection","meaning":"an estimate based on assumptions"},{"term":"migration","meaning":"movement of people between places"},{"term":"workforce participation","meaning":"the share of people working or looking for work"}],"challenge":"Write three likely policy priorities for an ageing Australia and explain the wellbeing reason for each.","question":"What is the difference between a projection and a prediction?","answer":"A projection shows what could happen under stated assumptions; it is not a guaranteed forecast."},{"id":35,"module":"population","title":"Youthful populations: Afghanistan and Syria","paragraphs":["A youthful population pyramid has a wide base, showing that children and teenagers make up a large share of the population. This pattern can create both opportunities and challenges.","In the short term, governments need enough schools, education staff, maternal health services, vaccinations and child healthcare. In the future, large numbers of young people will enter the labour force. If jobs are available, this can support economic growth. If jobs are not available, unemployment and social pressure may increase.","Conflict can complicate the picture. In countries affected by war or displacement, a youthful population may face disrupted schooling, damaged healthcare and migration.","When interpreting a youthful pyramid, avoid saying that the shape automatically proves poverty or conflict. The graph tells us about age structure. Other evidence is needed to explain why the pattern exists and what it means for wellbeing."],"terms":[{"term":"youthful population","meaning":"a population with a large share of young people"},{"term":"maternal health","meaning":"healthcare relating to pregnancy and childbirth"},{"term":"future labour force","meaning":"young people who will later enter working ages"}],"challenge":"Use: population pattern → service demand → future challenge/opportunity → wellbeing effect.","question":"What service is likely to face high demand in a youthful population?","answer":"Schools, child healthcare and maternal health services are likely to face strong demand."},{"id":36,"module":"population","title":"Migration and unusual population structures: the UAE","paragraphs":["Population pyramids can reveal migration as well as birth rates and ageing. The United Arab Emirates provides a striking example because its population structure contains a very large number of working-age males compared with females in several age groups.","A likely explanation is labour migration. Large numbers of men have moved to the UAE for work in construction, services and other industries. This creates a population structure that looks very different from a typical pyramid shaped mainly by births and deaths.","The case shows why geographers should not interpret population pyramids using one rule. A wide working-age section may reflect migration rather than a past baby boom. A strong interpretation uses the graph and then checks other evidence.","This also connects to wellbeing. Migrant workers contribute to the economy, but questions may arise about housing, working conditions, healthcare, rights and family separation. Population structure can therefore lead us into wider questions about social and economic wellbeing."],"terms":[{"term":"migrant labour","meaning":"workers who move for employment"},{"term":"sex ratio","meaning":"the relative number of males and females"},{"term":"labour migration","meaning":"movement mainly for work"}],"challenge":"Explain why a very large working-age male population might suggest labour migration. Identify two wellbeing questions you would investigate next.","question":"What other evidence would strengthen the migration explanation?","answer":"Migration statistics, employment data, visa or workforce data and information about major industries."}],"dimensions":[{"icon":"PH","name":"Physical","text":"Health, clean water, nutritious food, healthcare, housing and sanitation."},{"icon":"EC","name":"Economic","text":"Income, employment, financial security and access to material resources."},{"icon":"SO","name":"Social","text":"Relationships, support networks, belonging and participation in community life."},{"icon":"EN","name":"Environmental","text":"Air and water quality, green space, safety and protection from hazards."},{"icon":"ME","name":"Mental & emotional","text":"Stress, resilience, self-image, emotional health and a sense of purpose."},{"icon":"CU","name":"Cultural & spiritual","text":"Identity, language, traditions, beliefs and connection to culture or faith."},{"icon":"PO","name":"Political","text":"Rights, freedom, representation and participation in decisions."}]};

ong></div><div class="activity-item"><small>Current focus</small><strong id="focusLabel">All dimensions</strong></div><div class="activity-item"><small>Navigation</small><strong>Search / Shuffle / Expand</strong></div></div></section></main>';

function setupHeroSwap(){
 const el=document.getElementById('heroSwap'); if(!el)return;
 const words=['HEALTH','SECURITY','BELONGING','OPPORTUNITY','IDENTITY','PLACE','PURPOSE'];
 let i=0;
 clearInterval(window.__heroSwapTimer);
 window.__heroSwapTimer=setInterval(()=>{
  el.classList.add('out');
  setTimeout(()=>{i=(i+1)%words.length;el.textContent=words[i];el.classList.remove('out')},180)
 },2100)
}
function animateCounters(){
 document.querySelectorAll('.stat b').forEach(el=>{
  const target=parseInt(el.textContent,10); if(!Number.isFinite(target))return;
  el.classList.add('counter'); let start=0; const dur=520; const t0=performance.now();
  const tick=t=>{const p=Math.min(1,(t-t0)/dur);el.textContent=Math.round(target*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(tick)};
  requestAnimationFrame(tick)
 })
}

function wireTilt(){
 if(matchMedia('(pointer:coarse)').matches)return;
 document.querySelectorAll('.module-card').forEach(card=>{
  card.onmousemove=e=>{
   const r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
   card.classList.add('tilted');card.style.transform='perspective(700px) rotateX('+(-y*2.2)+'deg) rotateY('+(x*2.6)+'deg) translateY(-4px)'
  };
  card.onmouseleave=()=>{card.classList.remove('tilted');card.style.transform=''}
 })
}
function wirePageMotion(){
 const root=app.firstElementChild;if(root)root.classList.add('page-enter')
}
function openTopic(id){
 const t=DATA.topics.find(x=>x.id===Number(id)); if(!t)return;
 showModule(t.module);
 setTimeout(()=>{
  const d=document.querySelector('.topic[data-id="'+t.id+'"]');
  if(d){d.open=true;viewed.add(t.id);save();d.scrollIntoView({behavior:'smooth',block:'center'})}
 },60)
}
function setupSpotlight(){
 const title=document.getElementById('spotTitle'),copy=document.getElementById('spotCopy');
 const open=document.getElementById('openSpot'),shuffle=document.getElementById('shuffleSpot');
 if(!title||!copy)return;
 const show=()=>{
  const unseen=DATA.topics.filter(t=>!viewed.has(t.id));
  const pool=unseen.length?unseen:DATA.topics;
  const t=pool[Math.floor(Math.random()*pool.length)];
  title.textContent=t.title;
  copy.textContent=(t.paragraphs[0]||'').split(/(?<=[.!?])\s+/).slice(0,2).join(' ');
  open.onclick=()=>openTopic(t.id);
 };
 shuffle.onclick=show;show()
}
function setupBalance(){
 const sliders=[...document.querySelectorAll('.bal')];
 const update=()=>{
  const vals=sliders.map((s,i)=>{document.getElementById('balv'+i).textContent=s.value;return +s.value});
  const avg=Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
  const spread=Math.max(...vals)-Math.min(...vals);
  const ring=document.getElementById('scoreRing');
  ring.style.setProperty('--score',avg+'%');
  document.getElementById('scoreText').textContent=avg;
  const label=document.getElementById('scoreLabel'),hint=document.getElementById('scoreHint');
  if(spread>45){label.textContent='Uneven conditions';hint.textContent='A strong result in one area may not fully compensate for a major gap in another.'}
  else if(avg>=75){label.textContent='Strong overall conditions';hint.textContent='Several supportive conditions are working together in this profile.'}
  else if(avg>=50){label.textContent='A mixed wellbeing profile';hint.textContent='Some conditions are stronger than others, showing why wellbeing is multidimensional.'}
  else{label.textContent='Multiple areas under pressure';hint.textContent='Lower access or outcomes across several dimensions can combine and reduce overall quality of life.'}
 };
 sliders.forEach(s=>s.addEventListener('input',update));update()
}
function revealCards(){
 const els=document.querySelectorAll('.reveal-card');
 if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('visible'));return}
 const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target)}}),{threshold:.12});
 els.forEach(e=>io.observe(e))
}
function setDim(i){const d=DATA.dimensions[i];document.querySelectorAll('[data-dim]').forEach((b,n)=>b.classList.toggle('active',n===i));const detail=document.getElementById('wheelDetail');if(detail){detail.innerHTML='<strong>'+esc(d.name)+'</strong>'+esc(d.text)}if(window.activateNetworkDimension)window.activateNetworkDimension(i)}
function pills(active){return '<div class="pills">'+DATA.modules.map(m=>'<button class="pill '+(m.id===active?'active':'')+'" data-pill="'+m.id+'">'+m.icon+' '+esc(m.title)+'</button>').join('')+'</div>'}
function topicHTML(t){
 const terms=(t.terms||[]).map(k=>'<div class="term"><strong>'+esc(k.term)+'</strong><span>'+esc(k.meaning)+'</span></div>').join('');
 const paras=(t.paragraphs||[]).map(p=>'<p>'+esc(p)+'</p>').join('');
 return '<details class="topic" data-id="'+t.id+'"><summary><span class="topic-num">'+String(t.id).padStart(2,'0')+'</span><span class="topic-title">'+esc(t.title)+'</span><span class="chev">⌄</span></summary><div class="topic-body"><div class="article">'+paras+'</div><aside class="side"><div class="box"><div class="label">Key terms</div>'+terms+'</div>'+(t.challenge?'<div class="box mint"><div class="label">Explore</div>'+esc(t.challenge)+'</div>':'')+(t.question?'<details class="box check"><summary>Quick check</summary><div style="margin-top:8px">'+esc(t.question)+'</div><details style="margin-top:8px"><summary>Reveal answer</summary><div class="answer">'+esc(t.answer||'')+'</div></details></details>':'')+'</aside></div></details>'
}
function showModule(id){
 current=id;search.value='';

 app.innerHTML='<main><button class="back" id="back">← Overview</button>'+pills(id)+'<section class="module-top"><div class="flat-icon">'+m.icon+'</div><div><div class="kicker">'+topics.length+' topics • '+progress(m)+'% explored</div><h1>'+esc(m.title)+'</h1><p>'+esc(m.description)+'</p></div></section><div class="topic-list">'+topics.map(topicHTML).join('')+'</div>'+(m.sources.length?'<div class="section-head" style="margin-top:46px"><div><div class="kicker">Sources</div><h2>Go deeper</h2></div></div><div class="source-grid">'+m.sources.map(s=>'<a class="source" href="'+s.url+'" target="_blank" rel="noopener"><strong>'+esc(s.name)+' ↗</strong><span>'+esc(s.description)+'</span></a>').join('')+'</div>':'')+'</main>';

 document.querySelectorAll('[data-pill]').forEach(b=>b.onclick=()=>showModule(b.dataset.pill));
 document.querySelectorAll('.topic').forEach(d=>d.addEventListener('toggle',()=>{if(d.open){viewed.add(+d.dataset.id);save()}})); revealCards(); wirePageMotion();
}
function doSearch(){
 const q=search.value.trim().toLowerCase();
 if(!q){current?showModule(current):home();return}
 current=null;
 const hits=DATA.topics.filter(t=>[t.title,...t.paragraphs,...t.terms.flatMap(k=>[k.term,k.meaning]),t.challenge,t.question,t.answer].join(' ').toLowerCase().includes(q));
 app.innerHTML='<main><button class="back" id="back">← Overview</button><div class="section-head"><div><div class="kicker">Search</div><h2>'+hits.length+' result'+(hits.length===1?'':'s')+'</h2></div><p>'+esc(q)+'</p></div><div class="topic-list">'+(hits.length?hits.map(topicHTML).join(''):'<div class="empty">No matching topics found.</div>')+'</div></main>';
 document.getElementById('back').onclick=()=>{search.value='';home()};
 document.querySelectorAll('.topic').forEach(d=>{d.open=true;viewed.add(+d.dataset.id)});
 save(); wirePageMotion()
}
search.addEventListener('input',doSearch);
document.getElementById('brand').onclick=e=>{e.preventDefault();home()};

};
